name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    uses: iyulab/shared/.github/workflows/publish-npm.yml@a2e48ce2d6e8f5819c0ca99025734f625ec75f8a
    with:
      node_version: "24"
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
