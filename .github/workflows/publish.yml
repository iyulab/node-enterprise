name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    uses: iyulab/shared/.github/workflows/publish-npm.yml@a812e4874638261d7f268e2a0af904cbf026dbd6
    with:
      node_version: "24"
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
